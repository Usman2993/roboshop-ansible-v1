- name: crecate ec2 instance and r53 records
  hosts: local
  connection: local
  become: true
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: "create"
    domain_name: "usdaws92s.store"
    ami_id: ami-0055977a6e828a4f4
  tasks: 
  - name: crecate ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups:
      - roboshop-common
      - "roboshop-{{ item }}"
      region: us-east-1
    loop: "{{ instances }}"  
    when: action == "create"




      key_name: "daws-92s"
      group: "sg-0e7f1b8c3a5e4f6b9"
      instance_type: "t2.micro"
      image: "ami-0c55b159cbfafe1f0"
      wait: yes
      region: "us-east-1"
      count: 1
      instance_tags:
        Name: "roboshop-devops"
    register: ec2

  - name: print the output
    debug:
      msg: "{{ ec2 }}"